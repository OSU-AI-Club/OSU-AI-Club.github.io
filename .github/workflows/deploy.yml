# Builds the Vite app and publishes dist/ to GitHub Pages.
#
# This exists because GitHub Pages is a static file server: it cannot compile
# TypeScript or JSX. Serving the repo root directly meant index.html's
# `<script type="module" src="/src/main.tsx">` never resolved to an executable
# module, React never mounted, and every visitor got the boot splash followed by
# a blank page. The deployed artifact must be a build, never the source tree.
#
# Requires Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# With "Deploy from a branch" still selected this workflow runs but nothing it
# produces is ever served.
#
# EVENTS COME FROM GOOGLE CALENDAR, so this workflow is also the sync mechanism:
# the build fetches the calendar and bakes it into the bundle. That is why it
# has four triggers rather than two. See docs/calendar-sync.md.
#
#   push                -> a code change
#   workflow_dispatch   -> a human forcing a rebuild
#   repository_dispatch -> the Apps Script, seconds after a calendar edit
#   schedule            -> the safety net for when that trigger is broken
#
# Also requires the GOOGLE_CALENDAR_API_KEY repository secret. Without it the
# sync step warns and keeps the committed snapshot, so the build still passes
# but the site stops updating.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:
  # Fired by the Apps Script in scripts/apps-script/Code.gs when the club
  # calendar changes. This is the real freshness mechanism.
  repository_dispatch:
    types: [calendar-updated]
  schedule:
    # Every 6 hours, at :23. Off-the-hour deliberately — GitHub's scheduler is
    # heavily contended on the hour and routinely delays those runs by 10+ min.
    #
    # 6 hours, not 1: the dispatch above already covers the normal case, so this
    # only has to bound how stale the site can get while that is broken. Hourly
    # would mean ~8,760 deployments a year for a calendar that changes weekly.
    #
    # GOTCHA: GitHub disables scheduled workflows after 60 days of repository
    # inactivity and emails an admin. A club repo goes quiet every summer, so
    # expect this. The Actions tab shows a banner with an "Enable" button; the
    # other three triggers keep working meanwhile.
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` because a half-applied
# deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A fork inherits the schedule but not the secrets, so its scheduled runs
    # would fail every 6 hours forever. The other triggers stay available.
    if: github.event_name != 'schedule' || github.repository == 'OSU-AI-Club/OSU-AI-Club.github.io'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the site is developed against locally.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Between install and build on purpose: it runs through `tsx`, which npm
      # ci provides, and Vite inlines the JSON it writes at build time.
      #
      # Deliberately NOT continue-on-error. A red build here leaves the previous
      # deployment live — visitors keep seeing the last good calendar — and
      # sends someone an email. Swallowing the error would show the same page
      # with nobody alerted, which is how a site silently freezes for months.
      # The one case that does not fail: a missing API key, which the script
      # treats as "keep the committed snapshot" so fork PRs still build.
      - name: Sync events from Google Calendar
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: npm run sync:calendar

      # vite build uses esbuild and does not type-check, so this is the only
      # thing standing between a type error and production. It also covers
      # scripts/, which tsconfig.json picks up for free (it has no `include`).
      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      # Belt-and-braces. The Actions artifact path does not run Jekyll at all,
      # but this keeps the output correct if Pages is ever switched back to
      # branch-based serving, where Jekyll would otherwise skip underscore-
      # prefixed files.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # public/CNAME is copied verbatim into dist/ by Vite. Fail loudly rather
      # than silently shipping a build that unbinds the custom domain.
      - name: Verify CNAME survived the build
        run: test -f dist/CNAME && cat dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
